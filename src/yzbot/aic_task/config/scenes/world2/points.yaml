# ============================================================================
# world2 场景（test12 重构版 · 房间下半部）—— 2026-09-25 引入
# ----------------------------------------------------------------------------
# 来源：D:\桌面\2.0rl\test\test12\v2.0_mppi_fused\aic_task\config\world2_points.yaml
#
# 与 v1 场景的区别：物块位置、区域位置、小车初始位置**全部不同**（都在房间下半部）：
#   初始  (-0.884483, -11.938343, yaw -0.007388)
#   区域  A(-0.933257, -9.430909)  B(1.964742, -13.172080)  C(-1.628323, -10.105190)   ← B/C 于 2026-10-15 平移（原值见 git 历史）
#   物块  8 个，Y 约 -7.8 ~ -14.2
#   （v1 是：初始(0,0,0)、区域 A(4.388,-1.533)/B(-5.193,3.483)/C(7.000,3.096)、物块 Y 约 -5.1~4.2）
#   地图两者相同（mapn3），所以本文件只切"场景布局"。
#
# 转换说明（test12 原格式 → test14 需要的格式）：
#   1) 保留 world2 自己的 robot_initial_pose / 物块停车点（= 物块位置 + 0.30 m 东侧、yaw = π）
#      / 区域停车点 —— 这三样 test12 已经算好，直接沿用；
#   2) approach 段继承 test14 v1 的同一批参数，仅把"接近距离/staging"保持 world2 的 0.30 m；
#   3) zones 补 test14 需要的几何字段（region_yaw / size_x_m / size_y_m / placement_lateral_bias_m）；
#   4) dynamic_obstacles 沿用 test14 v1（两个 moving_box 在房间上半部 Y≈-3.5 / +0.9，
#      与本场景 Y≈-8~-14 相距 5 m 以上，不冲突；保留以维持题目难度一致）。
# ============================================================================

robot_initial_pose:
  frame_id: map
  x: -0.884483
  y: -11.938343
  yaw: -0.007388

approach:
  end_effector_forward_m: 0.40
  minimum_cubes_per_color: 4
  # 2026-09-27 老板拍板：接近距离 target=0.35（折中 0.30~0.40）。
  # 真因复盘：车被导航到 staging 点 = 候选点 + object_staging_backoff_m，
  # 旧 backoff=0.30 使 staging 距物块 0.60，超出 safety_max=0.55，判定必失败
  # （run_20260927_050425：object_circle_candidate 距物块 0.5996 吻合）。
  # 修复：staging_backoff 归零 + target/min 对齐 0.35（见下方 staging_backoff）。
  object_approach_distance_m: 0.35
  object_approach_target_distance_m: 0.35
  object_approach_min_distance_m: 0.35
  object_approach_max_distance_m: 0.50
  object_approach_safety_min_distance_m: 0.25
  object_approach_safety_max_distance_m: 0.55
  object_approach_yaw_tolerance_rad: 0.261799387799
  object_circle_candidate_count: 12
  object_circle_max_attempts: 5
  object_candidate_shortlist_count: 6
  object_path_prefilter_budget_sec: 2.0
  object_navigation_total_budget_sec: 60.0
  object_candidate_navigation_timeout_sec: 40.0
  object_circle_map_clearance_m: 0.32
  object_virtual_obstacle_exempt_radius_m: 1.20
  object_path_cube_clearance_m: 0.25
  object_recovery_distance_tolerance_m: 0.10
  object_recovery_yaw_tolerance_rad: 0.261799387799
  object_recovery_max_displacement_m: 1.20
  object_staging_backoff_m: 0.0
  object_yaw: 3.141592653589793
  zone_yaw: 0.0
  grasp_desired_arm_x_m: 0.395
  grasp_forward_tolerance_m: 0.03
  grasp_yaw_tolerance_rad: 0.05235987756
  grasp_base_correction_speed_mps: 0.15
  grasp_base_correction_max_attempts: 1
  cube_half_height_m: 0.015
  pre_attach_tolerance_m: 0.18
  attached_tolerance_m: 0.18
  placed_tolerance_m: 0.65
  region_nearby_tolerance_m: 0.35
  placement_stability_xy_m: 0.10
  placement_stable_samples: 3
  zone_base_nearby_tolerance_m: 0.60
  post_place_retreat_m: 0.50
  post_place_retreat_by_zone_m: {A: 0.60, B: 0.75, C: 0.50}
  post_place_retreat_min_timeout_sec: 10.0
  post_place_retreat_speed_mps: 0.50

navigation_fallback:
