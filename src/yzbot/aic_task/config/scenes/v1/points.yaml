    z: 0.25
    safety_radius_m: 0.65
    motion: {type: sine_x, center_x: 0.353, center_y: -3.460, amplitude_m: 1.2, omega_rad_s: 0.125, phase_rad: 0.0}
  - name: moving_box_2
    z: 0.25
    safety_radius_m: 0.65
