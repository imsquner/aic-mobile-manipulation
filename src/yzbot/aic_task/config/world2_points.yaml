# ============================================================================
# world2 场景（test12 重构版 · 房间下半部）—— 2026-09-25 引入
# ----------------------------------------------------------------------------
# 来源：D:\桌面\2.0rl\test\test12\v2.0_mppi_fused\aic_task\config\world2_points.yaml
#
# 与 v1 场景的区别：物块位置、区域位置、小车初始位置**全部不同**（都在房间下半部）：
#   初始  (-0.884483, -11.938343, yaw -0.007388)
#   区域  A(-0.933257, -9.430909)  B(2.032836, -12.909407)  C(-1.410625, -10.243129)
#   物块  8 个，Y 约 -7.8 ~ -14.2
#   （v1 是：初始(0,0,0)、区域 A(4.388,-1.533)/B(-5.193,3.483)/C(7.000,3.096)、物块 Y 约 -5.1~4.2）
#   地图两者相同（mapn3），所以本文件只切"场景布局"。
#
# 转换说明（test12 原格式 → test14 需要的格式）：
#   1) 保留 world2 自己的 robot_initial_pose / 物块停车点（= 物块位置 + 0.30 m 东侧、yaw = π）
#      / 区域停车点 —— 这三样 test12 已经算好，直接沿用；
#   2) approach 段继承 test14 v1 的同一批参数，仅把"接近距离/staging"保持 world2 的 0.30 m；
#   3) zones 补 test14 需要的几何字段（region_yaw / size_x_m / size_y_m / placement_lateral_bias_m）；
#   4) dynamic_obstacles 沿用 test14 v1（两个 moving_box 在房间上半部 Y≈-3.5 / +0.9，
#      与本场景 Y≈-8~-14 相距 5 m 以上，不冲突；保留以维持题目难度一致）。
# ============================================================================

